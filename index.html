<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <div class="container mt-5"> <!-- contenedor principal con margen superior -->

        <div class="calculator-layout"> <!-- contenedor para la calculadora y el panel del historial -->
            <div class="calc-container calc-panel"> <!-- contenedor para la calculadora -->
                <h1>Calculadora</h1>
                <div>
                    <input type="text" id="display" readonly class="form-control mb-3 calc-display"> <!-- pantalla de la calculadora -->
                </div>

                <div class="button-grid"> <!-- contenedor para los botones de la calculadora -->
                 <button class="btn btn-secondary" data-value="7">7</button> <!-- botones de la calculadora con eventos onclick para agregar el valor al display -->
                 <button class="btn btn-secondary" data-value="8">8</button>
                 <button class="btn btn-secondary" data-value="9">9</button>
                 <button class="btn btn-primary" data-value="/">/</button>

                 <button class="btn btn-secondary" data-value="4">4</button>
                 <button class="btn btn-secondary" data-value="5">5</button>
                 <button class="btn btn-secondary" data-value="6">6</button>
                 <button class="btn btn-primary" data-value="*">*</button>

                 <button class="btn btn-secondary" data-value="1">1</button>
                 <button class="btn btn-secondary" data-value="2">2</button>
                 <button class="btn btn-secondary" data-value="3">3</button>
                 <button class="btn btn-primary" data-value="-">-</button>

                 <button class="btn btn-secondary btn-zero" data-value="0">0</button>
                 <button class="btn btn-secondary" data-value=".">.</button>
                 <button class="btn btn-primary btn-add" data-value="+">+</button>

                 <button class="btn btn-danger" data-value="C">C</button>
                 <button class="btn btn-warning" data-value="DEL">DEL</button>
                 <button class="btn btn-success" data-value="=">=</button>
                 <button class="btn btn-info" data-value="H">H</button>
                </div> 


            </div>

            <aside class="history-panel" id="history-panel"> <!-- panel lateral para mostrar el historial de cálculos -->
                <h2>Historial</h2>
                <p class="history-note">Últimos 10 cálculos</p>
                <ul id="historial-list" class="history-list"></ul> <!-- lista para mostrar el historial de cálculos -->
            </aside> 
        </div>

        <footer class="mt-5 text-center"> <!-- pie de página con margen superior y centrado -->
            <p> &copy; Ricardo Medina 2026 Calculadora. Todos los derechos reservados</p>
        </footer>
    </div>

    
</body>

<script src="./src/js/calculadora.js"></script> <!-- script para la lógica de la calculadora -->

</html>
